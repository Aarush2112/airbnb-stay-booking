{% extends 'website/base.html' %}

{% block title %}Log in — StayVista{% endblock %}

{% block content %}
  <div class="auth-wrapper">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to manage your StayVista trips and booking inquiries.</p>

    <form method="post" action="{% url 'website:login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label for="id_identifier">Username or Email</label>
        <input type="text" id="id_identifier" name="identifier" value="{{ identifier }}" placeholder="Enter username or email" required>
      </div>
      <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" id="id_password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <div class="auth-footer-links">
      <span>Don't have an account? <a href="{% url 'website:signup' %}" class="text-link">Create an account</a></span>
      <a href="{% url 'website:home' %}" class="text-link">&larr; Back to Home</a>
    </div>
  </div>
{% endblock %}
