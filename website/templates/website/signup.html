{% extends 'website/base.html' %}

{% block title %}Sign up — StayVista{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <h1>Create your account</h1>
  <p class="auth-subtitle">Join StayVista to save stays and send booking requests in only one click.</p>

  <form method="post" action="{% url 'website:signup' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_full_name">Full Name</label>
      <input type="text" id="id_full_name" name="full_name" value="{{ form_data.full_name }}"
        placeholder="e.g. Rahul Verma" required>
    </div>
    <div class="form-group">
      <label for="id_username">Username</label>
      <input type="text" id="id_username" name="username" value="{{ form_data.username }}"
        placeholder="Choose a username" required>
    </div>
    <div class="form-group">
      <label for="id_email">Email Address</label>
      <input type="email" id="id_email" name="email" value="{{ form_data.email }}" placeholder="name@example.com"
        required>
    </div>
    <div class="form-group">
      <label for="id_password">Password (min. 8 characters)</label>
      <input type="password" id="id_password" name="password" minlength="8" placeholder="Create a strong password"
        required>
    </div>
    <div class="form-group">
      <label for="id_confirm_password">Confirm Password</label>
      <input type="password" id="id_confirm_password" name="confirm_password" minlength="8"
        placeholder="Re-enter your password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign up</button>
  </form>

  <div class="auth-footer-links">
    <span>Already have an account? <a href="{% url 'website:login' %}" class="text-link">Log in</a></span>
    <a href="{% url 'website:home' %}" class="text-link">&larr; Back to Home</a>
  </div>
</div>
{% endblock %}
